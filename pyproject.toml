[project]
name = "nosnoc"
version = "0.2.0"
dependencies = [
  'numpy>=1.20.0',
  'scipy',
  'casadi>=3.6.0',
  'matplotlib'
]
requires-python = ">=3.8"
authors = [
  {name = "Anton Pozharskiy", email = "anton.pozharskiy@imtek.uni-freiburg.de"},
  {name = "Jonathan Frey", email = "jonathan.frey@imtek.uni-freiburg.de"},
  {name = "Armin Nurkanovic", email = "armin.nurkanovic@imtek.uni-freiburg.de"},
]
maintainers = [
  {name = "Anton Pozharskiy", email = "anton.pozharskiy@imtek.uni-freiburg.de"}
]
description = "Nonsmooth Numerical Optimal Control for Python"
readme = "README.md"
license = {file = "LICENSE"}

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[dependency-groups]
test = [
     'pytest',
     'pytest-cov',
     'parameterized',
]

docs = [
     'sphinx',
     'sphinx-rtd-theme',
     'sphinx-toolbox',
     'enum-tools',
]