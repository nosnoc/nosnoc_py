name: nosnoc tests

on:
  pull_request:
  push:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
permissions:
  checks: write
  pull-requests: write # only required if `comment: true` was enabled

jobs:
  test_nosnoc:
    name: nosnoc_py - python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # windows-latest, macos-latest] for now just ubuntu
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python and pip package
      shell: bash
      run: |
        pip install -e . --group test

    - name: Run tests
      shell: bash
      run: |
        mkdir -p test-results-${{ matrix.python-version }}
        python -m pytest --junitxml test-results-${{ matrix.python-version }}/results.xml --cov=nosnoc --cov-report=html:test-results-${{ matrix.python-version }}/coverage test --tb=long -n 2

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results-${{ matrix.python-version }}/
        retention-days: 1

  test_comment:
    name: publish test results comment
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [test_nosnoc]
    steps:
      - name: Download Test Report
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'test-results-*/results.xml'
          comment: true
